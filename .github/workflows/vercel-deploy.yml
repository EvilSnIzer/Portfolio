# Deploys this repo to Vercel (preview on PRs, production on main).
# Requires repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Without them the job still installs + builds to validate the change.
name: Vercel deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ENV=preview
          else
            ENV=production
          fi
          npx -y vercel pull --yes --environment="$ENV" --token="$VERCEL_TOKEN"
          if [ "$ENV" = "production" ]; then
            npx -y vercel build --prod --token="$VERCEL_TOKEN"
            npx -y vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx -y vercel build --token="$VERCEL_TOKEN"
            npx -y vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
